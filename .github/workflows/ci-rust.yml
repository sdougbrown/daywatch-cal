name: CI (Rust)

on:
  push:
    branches: [main]
    tags:
      - 'rust-v*'
    paths:
      - 'crates/**'
      - 'conformance/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci-rust.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'conformance/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci-rust.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  publish:
    if: startsWith(github.ref, 'refs/tags/rust-v')
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # The tag must match the crate version (rust-v0.1.0 ↔ 0.1.0) so a stale
      # tag cannot publish a mismatched release.
      - name: Verify tag matches crate version
        working-directory: crates/daywatch-cal
        run: |
          crate_version="rust-v$(cargo metadata --no-deps --format-version 1 | python3 -c \
            "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")"
          if [ "${GITHUB_REF_NAME}" != "${crate_version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match crate version ${crate_version}"
            exit 1
          fi

      - name: Publish to crates.io
        working-directory: crates/daywatch-cal
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
