name: Release MCP Binaries

# Builds self-contained @daywatch/mcp binaries (one per OS/arch, no Node
# runtime required) and attaches them to a GitHub Release. Consumed by the
# `daywatch` Claude Code plugin's run.sh, which downloads the matching asset
# on first launch.
#
# Trigger by pushing a tag like `mcp-v0.1.2`, or run manually via the
# Actions tab (workflow_dispatch) — by default the manual run derives the
# tag from packages/mcp/package.json.

on:
  push:
    tags:
      - 'mcp-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. mcp-v0.1.2). Defaults to mcp-v<package version>.'
        required: false

permissions:
  contents: write

concurrency:
  group: release-mcp-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build workspace
        run: yarn turbo run build

      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="$(node -p "require('./packages/mcp/package.json').version")"
            TAG="mcp-v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Compile binaries (cross-target via bun)
        run: |
          set -euo pipefail
          mkdir -p dist-bin
          # bun cross-compiles all targets from a single Linux runner.
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            echo "::group::daywatch-mcp-$target"
            bun build --compile --target="bun-$target" \
              packages/mcp/src/index.ts \
              --outfile "dist-bin/daywatch-mcp-$target"
            echo "::endgroup::"
          done
          ( cd dist-bin && sha256sum daywatch-mcp-* > sha256sums.txt )
          ls -lh dist-bin
          cat dist-bin/sha256sums.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets (clobber)."
            gh release upload "$TAG" dist-bin/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Creating release $TAG."
            gh release create "$TAG" dist-bin/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "daywatch-mcp $TAG" \
              --notes "Self-contained \`@daywatch/mcp\` binaries — no Node runtime required. Consumed by the \`daywatch\` Claude Code plugin's run.sh, which downloads the matching OS/arch asset on first launch. Verify with sha256sums.txt."
          fi
